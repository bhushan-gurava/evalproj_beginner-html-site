apiVersion: apps/v1
kind: Deployment
metadata:
    name: custom-deployment
    labels:
        app: custom
spec:
    replicas: 5
    selector:
        matchLabels:
            app: custom
    template:
        metadata:
            labels:
                app: custom
        spec:
            containers:
              - name: custom
                image: bhushang300912/image03072025
                ports:
                  - containerPort: 80
